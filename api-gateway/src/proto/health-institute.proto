syntax = "proto3";

package health_institute;

service HealthInstituteService {
  rpc CreateHealthInstituteProfile(HealthInstituteProfileReq) returns (HealthInstituteProfileRes);

  rpc UpdateHealthInstituteProfile(UpdateHealthInstituteProfileReq) returns (UpdateHealthInstituteProfileRes);

  rpc GetHealthInstituteDetails(GetHealthInstituteDetailsReq) returns (GetHealthInstituteDetailsRes);

  rpc GetStates(GetStatesReq) returns (GetStatesRes);

  rpc GetDistricts(GetDistrictsReq) returns (GetDistrictsRes);

  rpc GetRegistrationCouncils(GetRegistrationCouncilReq) returns (GetRegistrationCouncilRes);

  rpc GetAppointDoctorMasterData(GetAppointDoctorMasterDataReq) returns (GetAppointDoctorMasterDataRes);

  rpc AppointDoctor(AppointDoctorReq) returns (AppointDoctorRes);

  rpc GetAppointedDoctors(GetAppointedDoctorsReq) returns (GetAppointedDoctorsRes);
}

message HealthInstituteProfileReq {
  uint32 healthInstitutePrimaryKey = 1;
  string healthInstituteId         = 2;
  string healthInstituteName       = 3;
  uint32 healthInstituteType       = 4;
  string email                     = 5;
}

message HealthInstituteProfileRes {
  string healthInstituteId = 1;
}

message UpdateHealthInstituteProfileReq {
  uint32          healthInstituteProfileId = 1;
  string          healthInstituteId        = 2;
  string          registrationNumber       = 3;
  optional string phone                    = 4;
  optional string address                  = 5;
  uint32          stateId                  = 6;
  uint32          districtId               = 7;
  string          pincode                  = 8;
}

message UpdateHealthInstituteProfileRes {
  string healthInstituteId = 1;
}

message GetHealthInstituteDetailsReq {
  uint32 healthInstitutePrimaryId = 1;
  string healthInstituteId        = 2;
}

message HealthInstituteProfileDetails {
  uint32          healthInstituteProfileId = 1;
  string          healthInstituteName      = 2;
  uint32          healthInstituteType      = 3;
  optional string registrationNumber       = 4;
  string          email                    = 5;
  optional string phone                    = 6;
  optional string address                  = 7;
  optional uint32 stateId                  = 8;
  optional string stateName                = 9;
  optional uint32 districtId               = 10;
  optional string districtName             = 11;
  optional string pincode                  = 12;
}

message GetHealthInstituteDetailsRes {
  uint32                        healthInstitutePrimaryKey = 1;
  string                        healthInstituteId         = 2;
  HealthInstituteProfileDetails profileDetails            = 3;
}

message MasterDataItem {
  uint32 id   = 1;
  string name = 2;
  string code = 3;
}

message GetStatesReq {}

message GetStatesRes{
  repeated MasterDataItem states = 1;
}

message GetDistrictsReq {
  uint32 stateId = 1;
}

message GetDistrictsRes {
  repeated MasterDataItem districts = 1;
}

message GetRegistrationCouncilReq {}

message GetRegistrationCouncilRes {
  repeated MasterDataItem registrationCouncils = 1;
}

message GetAppointDoctorMasterDataReq {}

message GetAppointDoctorMasterDataRes {
  repeated MasterDataItem departments        = 1;
  repeated MasterDataItem designations       = 2;
  repeated MasterDataItem consultationScopes = 3;
}

message AppointDoctorReq {
  uint32          healthInstitutePrimaryKey = 1;
  string          healthInstituteId         = 2;
  uint32          doctorPrimaryKey          = 3;
  string          doctorId                  = 4;
  string          departmentId              = 5;
  uint32          designation               = 6;
  string          joiningDate               = 7;
  uint32          consultationScope         = 8;
  optional string affiliationNotes          = 9;
}

message AppointDoctorRes {
  uint32 mappingId = 1;
}

message getAppointedDoctorListReq {
  uint32 healthInstitutePrimaryKey = 1;
}

message GetAppointedDoctorsReq {
  uint32          healthInstitutePrimaryKey = 1;
  uint32          offset                    = 2;
  uint32          limit                     = 3;
  optional string search                    = 4;
  optional uint32 departmentId              = 5;
  optional uint32 designationId             = 6;
  optional uint32 consultationScopeId       = 7;
}

message AppointedDoctorMapping {
  uint32 mappingId             = 1;
  uint32 doctorPrimaryKey      = 2;
  string doctorId              = 3;
  uint32 departmentId          = 4;
  string departmentName        = 5;
  uint32 designationId         = 6;
  string designationName       = 7;
  string joiningDate           = 8;
  uint32 consultationScopeId   = 9;
  string consultationScopeName = 10;
  bool   status                = 11;
}

message GetAppointedDoctorsRes {
  repeated AppointedDoctorMapping doctors = 1;
  uint32                          total   = 2;
  uint32                          offset  = 3;
  uint32                          limit   = 4;
}