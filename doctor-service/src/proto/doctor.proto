syntax = "proto3";

package doctor;

service DoctorService {
  rpc CreateDoctorProfile(DoctorProfileReq) returns (DoctorProfileRes);

  rpc UpdateDoctorBasicDetails(UpdateDoctorBasicDeatilsReq) returns (UpdateDoctorBasicDeatilsRes);

  rpc UpdateDoctorProfessionalDetails(UpdateDoctorProfessionalDetailsReq) returns (UpdateDoctorProfessionalDetailsRes);

  rpc UpdateDoctorQualifications(UpdateDoctorQualificationsReq) returns (UpdateDoctorQualificationsRes);

  rpc GetDoctorDetails(GetDoctorDetailsReq) returns (GetDoctorDetailsRes);

  rpc GetDoctorMasterData(GetDoctorMasterDataReq) returns (GetDoctorMasterDataRes);

  rpc GetDoctorList(GetDoctorListReq) returns (GetDoctorListRes);
}

message DoctorProfileReq {
  uint32          doctorPrimaryKey = 1;
  string          doctorId         = 2;
  string          email            = 3;
  string          mobile           = 4;
  string          firstName        = 5;
  optional string middleName       = 6;
  string          lastName         = 7;
}

message DoctorProfileRes {
  string doctorId = 1;
}

message UpdateDoctorBasicDeatilsReq {
  uint32          doctorProfileId = 1;
  string          doctorId        = 2;
  optional string firstName       = 3;
  optional string middleName      = 4;
  optional string lastName        = 5;
  optional uint32 gender          = 6;
  optional string profileImage    = 7;
}

message UpdateDoctorBasicDeatilsRes {
  string doctorId = 1;
}

message UpdateDoctorProfessionalDetailsReq {
  optional uint32 doctorProfessionalDetailsId = 1;
  uint32          doctorPrimaryKey            = 2;
  string          doctorId                    = 3;
  string          medicalRegistration         = 4;
  uint32          registrationCouncil         = 5;
  uint32          registrationState           = 6;
  uint32          registrationYear            = 7;
  uint32          licenseStatus               = 8;
}

message UpdateDoctorProfessionalDetailsRes {
  string doctorId = 1;
}

message DoctorQualification {
  optional uint32 doctorQualificationId = 1;
  uint32          qualificationId       = 2;
  optional uint32 specializationId      = 3;
  string          institutionName       = 4;
  string          universityName        = 5;
  uint32          yearOfCompletion      = 6;
}

message UpdateDoctorQualificationsReq {
  uint32                       doctorPrimaryKey = 1;
  string                       doctorId         = 2;
  repeated DoctorQualification qualifications   = 3;
}

message UpdateDoctorQualificationsRes {
  string doctorId = 1;
}

message GetDoctorDetailsReq {
  uint32 doctorPrimaryKey = 1;
  string doctorId         = 2;
}

message GetDoctorProfileDetails {
  uint32          doctorProfileId = 1;
  string          email           = 2;
  string          mobile          = 3;
  string          firstName       = 4;
  optional string middleName      = 5;
  string          lastName        = 6;
  optional uint32 gender          = 7;
  optional string profileImage    = 8;
}

message GetDoctorProfessionalDetails {
  optional uint32 doctorProfessionalDetailsId = 1;
  optional string medicalRegistration         = 2;
  optional uint32 registrationCouncilId       = 3;
  optional string registrationCouncilName     = 4;
  optional uint32 registrationStateId         = 5;
  optional string registrationStateName       = 6;
  optional uint32 registrationYear            = 7;
  optional uint32 licenseStatus               = 8;
}

message GetDoctorQualificationDetails {
  uint32          doctorQualificationId = 1;
  uint32          qualificationId       = 2;
  string          qualificationName     = 3;
  optional uint32 specializationId      = 4;
  optional string specializationName    = 5;
  string          institutionName       = 6;
  string          universityName        = 7;
  uint32          yearOfCompletion      = 8;
}

message GetDoctorDetailsRes {
  uint32                                 doctorPrimaryKey     = 1;
  string                                 doctorId             = 2;
  GetDoctorProfileDetails                profileDetails       = 3;
  GetDoctorProfessionalDetails           professionalDetails  = 4;
  repeated GetDoctorQualificationDetails qualificationDetails = 5;
}

message GetDoctorMasterDataReq {}

message MasterDataItem {
  uint32 id   = 1;
  string name = 2;
  string code = 3;
}

message GetDoctorMasterDataRes {
  repeated MasterDataItem registrationCouncils = 1;
  repeated MasterDataItem states               = 2;
  repeated MasterDataItem qualifications       = 3;
  repeated MasterDataItem specializations      = 4;
}

message GetDoctorListReq {
  optional uint32 offset    = 1;
  optional uint32 limit     = 2;
  optional string search    = 3;
  optional uint32 stateId   = 4;
  optional uint32 councilId = 5;
}

message DoctorListItem {
  string          doctorId                = 1;
  string          firstName               = 2;
  optional string middleName              = 3;
  string          lastName                = 4;
  string          medicalRegistration     = 5;
  uint32          licenseStatus           = 6;
  optional uint32 registrationStateId     = 7;
  optional uint32 registrationCouncilId   = 8;
  optional string registrationStateName   = 9;
  optional string registrationCouncilName = 10;
}

message GetDoctorListRes {
  repeated DoctorListItem doctors = 1;
  uint32                  total   = 2;
  uint32                  offset  = 3;
  uint32                  limit   = 4;
}