apiVersion: v1
kind: Service
metadata:
  name: health-institute-service
  namespace: arogyalink
spec:
  selector:
    app: health-institute
  ports:
    - name: access-port
      protocol: TCP
      port: 8083
      targetPort: 8083
    - name: grpc-port
      protocol: TCP
      port: 50052
      targetPort: 50052
