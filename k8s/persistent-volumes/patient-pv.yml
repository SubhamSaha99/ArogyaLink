apiVersion: v1
kind: PersistentVolume
metadata:
  name: patient-pv
  namespace: arogyalink
spec:
  storageClassName: local-storage
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/patient-service
