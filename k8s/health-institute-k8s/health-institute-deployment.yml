apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-institute-deployment
  namespace: arogyalink
spec:
  selector:
    matchLabels:
      app: health-institute
  template:
    metadata:
      labels:
        app: health-institute
    spec:
      containers:
        - name: arogyalink-health-institute
          image: subhamsahadev/arogyalink-health-institute-service:1.0.0
          resources:
            requests:
              memory: "500Mi"
              cpu: "1g"
            limits:
              memory: "1Gi"
              cpu: "2g"
          ports:
            - containerPort: 8083
            - containerPort: 5052

          # Environments
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: nodeEnv
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: dbHost
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: dbPort
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: dbUsername
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: dbPassword
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: dbName
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: port
            - name: DOCTOR_SERVICE_GRPC_URL
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: doctorServiceGrpcUrl
            - name: HEALTH_INSTITUTE_SERVICE_GRPC_URL
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: healthInstituteServiceGrpcUrl
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: jwtAccessSecret
            - name: JWT_ACCESS_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: jwtAccessExpiresIn
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: jwtRefreshSecret
            - name: JWT_REFRESH_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: jwtRefreshExpiresIn
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: redisHost
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: health-institute-secret
                  key: redisPort

      #     volumeMounts:
      #       - name: health-institute-storage
      #         mountPath: /usr/src/app/uploads

      # volumes:
      #   - name: health-institute-storage
      #     persistentVolumeClaim:
      #       claimName: health-institute-pvc
