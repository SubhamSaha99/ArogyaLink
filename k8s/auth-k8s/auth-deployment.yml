apiVersion: apps/v1
kind: Deployment
metadata:
  name: arogyalink-auth-deployment
  namespace: arogyalink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth

  template:
    metadata:
      name: auth-pod
      namespace: arogyalink
      labels:
        app: auth

    spec:
      containers:
        - name: arogyalink-auth
          image: subhamsahadev/arogyalink-auth-service:1.0.0
          resources:
            requests:
              memory: "500Mi"
              cpu: "1g"
            limits:
              memory: "1Gi"
              cpu: "2g"
          ports:
          - containerPort: 8081

          # Environment variables
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: nodeEnv
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: dbHost
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: dbPort
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: dbUsername
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: dbPassword
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: dbName
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: port
            - name: DOCTOR_SERVICE_GRPC_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: doctorServiceGrpcUrl
            - name: HEALTH_INSTITUTE_SERVICE_GRPC_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: healthInstituteServiceGrpcUrl
            - name: PATIENT_SERVICE_GRPC_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: patientServiceGrpcUrl
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: jwtAccessSecret
            - name: JWT_ACCESS_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: jwtAccessExpiresIn
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: jwtRefreshSecret
            - name: JWT_REFRESH_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: jwtRefreshExpiresIn
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: redisHost
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: redisPort
          volumeMounts:
            - name: auth-storage
              mountPath: /usr/src/app/uploads

      volumes:
        - name: auth-storage
          persistentVolumeClaim:
            claimName: auth-pvc