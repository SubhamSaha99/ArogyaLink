apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: patient-mongo-statefulset
  namespace: arogyalink
spec:
  serviceName: patient-mongo-service
  replicas: 1
  selector:
    matchLabels:
      app: patient-mongo
  template:
    metadata:
      labels:
        app: patient-mongo
    spec:
      containers:
        - name: patient-mongo
          image: mongo:8.0.4
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 1G
              memory: 500Mi
            limits:
              cpu: 2G
              memory: 1Gi
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: patient-secret
                  key: mongoInitDbRootUsername

            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patient-secret
                  key: mongoInitDbRootPassword

          volumeMounts:
            - name: patient-mongo-data
              mountPath: /data/db
  
  volumeClaimTemplates:
    - metadata:
        name: patient-mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
