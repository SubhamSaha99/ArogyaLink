syntax = "proto3";

package doctor;

service DoctorService {
  rpc GetAppointedDoctorDetails(GetAppointedDoctorDetailsReq) returns (GetAppointedDoctorDetailsRes);

  rpc GetUnAppointedDoctorsList(GetUnAppointedDoctorsListReq) returns (GetDoctorListRes);
}


message GetAppointedDoctorDetailsReq {
  repeated uint32 doctorPrimaryKeys = 1;
}

message DoctorDetails {
  uint32          doctorPrimaryKey    = 1;
  string          firstName           = 2;
  optional string middleName          = 3;
  string          lastName            = 4;
  string          medicalRegistration = 5;
  uint32          licenseStatus       = 6;
}

message GetAppointedDoctorDetailsRes {
  repeated DoctorDetails doctors = 1;
}

message GetUnAppointedDoctorsListReq {
  repeated uint32 doctorPrimaryKeys = 1;
  optional uint32 offset            = 2;
  optional uint32 limit             = 3;
  optional string search            = 4;
  optional uint32 stateId           = 5;
  optional uint32 councilId         = 6;
}

message DoctorListItem {
  string          doctorId                = 1;
  string          firstName               = 2;
  optional string middleName              = 3;
  string          lastName                = 4;
  string          medicalRegistration     = 5;
  uint32          licenseStatus           = 6;
  optional uint32 registrationStateId     = 7;
  optional uint32 registrationCouncilId   = 8;
  optional string registrationStateName   = 9;
  optional string registrationCouncilName = 10;
}

message GetDoctorListRes {
  repeated DoctorListItem doctors = 1;
  uint32                  total   = 2;
  uint32                  offset  = 3;
  uint32                  limit   = 4;
}