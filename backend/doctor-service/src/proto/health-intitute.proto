syntax = "proto3";

package health_institute;

service HealthInstituteService {
  rpc GetAssociatedHealthInstitutes(GetAssociatedHealthInstitutesReq) returns (GetAssociatedHealthInstitutesRes);

  rpc GetAssociatedHealthInstitutesMasterData(GetAssociatedHealthInstitutesReq) returns (GetAssociatedHealthInstitutesMasterDataRes);
}

message GetAssociatedHealthInstitutesReq {
  uint32 doctorPrimaryKey = 1;
  string doctorId         = 2;
}

message GetAssociatedHealthInstitutesData {
  uint32 healthInstitutePrimaryKey = 1;
  string healthInstituteId         = 2;
  string healthInstituteName       = 3;
  uint32 departmentId              = 4;
  string departmentName            = 5;
  uint32 designationId             = 6;
  string designationName           = 7;
  string joiningDate               = 8;
  uint32 consultationScopeId       = 9;
  string consultationScopeName     = 10;
}

message GetAssociatedHealthInstitutesRes {
  repeated GetAssociatedHealthInstitutesData healthInstitutes = 1;
}

message MasterDataItem {
  uint32 id   = 1;
  string name = 2;
  string code = 3;
}

message GetAssociatedHealthInstitutesMasterDataRes {
  repeated MasterDataItem healthInstitutes = 1;
}